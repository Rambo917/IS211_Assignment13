{% extends 'base.html' %}{% block content %}<h1>Add Quiz</h1><form method="post"><label>Subject<input name="subject" required value="{{ request.form.get('subject','') }}"></label><label>Number of Questions<input type="number" min="1" name="questions" required value="{{ request.form.get('questions','') }}"></label><label>Quiz Date<input type="date" name="quiz_date" required value="{{ request.form.get('quiz_date','') }}"></label><button type="submit">Add Quiz</button></form>{% endblock %}
