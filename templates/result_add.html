{% extends 'base.html' %}{% block content %}<h1>Add Quiz Result</h1><form method="post"><label>Student<select name="student_id" required>{% for s in students %}<option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }} (ID {{ s.id }})</option>{% endfor %}</select></label><label>Quiz<select name="quiz_id" required>{% for q in quizzes %}<option value="{{ q.id }}">{{ q.subject }} (ID {{ q.id }})</option>{% endfor %}</select></label><label>Score (0–100)<input type="number" min="0" max="100" name="score" required></label><button type="submit" {% if not students or not quizzes %}disabled{% endif %}>Add Quiz Result</button></form>{% if not students or not quizzes %}<p>Add at least one student and one quiz first.</p>{% endif %}{% endblock %}
