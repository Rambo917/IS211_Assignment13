<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Quiz Tracker</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:35px auto;padding:0 16px;color:#222}a{color:#1559a4}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:24px}table{border-collapse:collapse;width:100%;margin:15px 0 25px}th,td{border:1px solid #bbb;text-align:left;padding:10px}th{background:#eee}input,select{padding:8px;margin:6px 0 15px;display:block;min-width:240px}button,.button{padding:9px 14px;background:#1559a4;color:white;border:0;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}.error{background:#ffe6e6;padding:12px}section{margin-bottom:28px}</style></head>
<body>
{% for message in get_flashed_messages() %}<p class="error">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</body></html>
